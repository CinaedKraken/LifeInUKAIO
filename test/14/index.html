]\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-4 py-6 w-full flex-1 flex flex-col\",\"children\":[\"$\",\"$L12\",null,{\"mockTest\":{\"setId\":14,\"title\":{\"en\":\"Mock Exam Set 14\",\"zh\":\"模擬考試 第14套\"},\"questions\":[{\"id\":\"14-1\",\"question\":{\"en\":\"Which flower is associated with Scotland?\",\"zh\":\"哪種花與蘇格蘭相關聯？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"The Shamrock\",\"zh\":\"三葉草\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"The Rose\",\"zh\":\"玫瑰\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"The Daffodil\",\"zh\":\"水仙花\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"The Thistle\",\"zh\":\"薊花\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"The thistle is the traditional national emblem and flower of Scotland.\",\"zh\":\"薊花是蘇格蘭傳統的國家象徵和國花。\"}},{\"id\":\"14-2\",\"question\":{\"en\":\"The National Anthem \\\"God save the queen\\\" can only be played in the presence of the Queen.\",\"zh\":\"國歌《天佑女王》只能在女王在場時演奏。\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"True\",\"zh\":\"正確\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"False\",\"zh\":\"錯誤\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"This statement is false. The National Anthem is played on many public and official occasions, such as sports events, and does not require the presence of the Monarch.\",\"zh\":\"此陳述是錯誤的。國歌會在許多公眾和官方場合演奏（例如體育賽事），並不需要君主在場。\"}},{\"id\":\"14-3\",\"question\":{\"en\":\"Who was the first person in England to print books using a printing press?\",\"zh\":\"誰是英格蘭第一位使用印刷機印製書籍的人？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"William Shakespeare\",\"zh\":\"威廉·莎士比亞\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"John Barbour\",\"zh\":\"約翰·巴伯\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Geoffrey Chaucer\",\"zh\":\"傑弗里·喬叟\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"William Caxton\",\"zh\":\"威廉·卡克斯頓\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"William Caxton was the first person in England to print books using a printing press.\",\"zh\":\"威廉·卡克斯頓（William Caxton）是英格蘭第一個使用印刷機印書的人。\"}},{\"id\":\"14-4\",\"question\":{\"en\":\"What is the name of the area in London where famous theatres are located?\",\"zh\":\"倫敦著名劇院林立的地區稱為什麼？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Soho\",\"zh\":\"蘇荷區 (Soho)\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Theatreland\",\"zh\":\"劇院區 (Theatreland)\"},\"isCorrect\":true},{\"id\":\"C\",\"text\":{\"en\":\"Westminster\",\"zh\":\"西敏寺 (Westminster)\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Hyde Park\",\"zh\":\"海德公園\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"The area in London famous for its concentration of theatres is known as Theatreland, located in the West End.\",\"zh\":\"劇院區 (Theatreland)。倫敦西區的劇院聚集地被稱為「劇院區」。\"}},{\"id\":\"14-5\",\"question\":{\"en\":\"Which court deals with minor criminal offences in Scotland?\",\"zh\":\"在蘇格蘭，哪個法庭負責審理輕微的刑事犯罪？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"The Sheriff Court\",\"zh\":\"郡長法庭\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"The Magistrate's Court\",\"zh\":\"治安法庭\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"The Crown Court\",\"zh\":\"刑事法院\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"The Justice of the Peace Court\",\"zh\":\"太平紳士法庭\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"In Scotland, minor criminal cases are heard in the Justice of the Peace Court, while more serious ones go to the Sheriff Court or High Court.\",\"zh\":\"在蘇格蘭，輕微刑事案件由太平紳士法庭審理，而較嚴重的案件則由郡長法庭或高等法院審理。\"}},{\"id\":\"14-6\",\"question\":{\"en\":\"What sort of battle was the 'Battle of Britain', fought between Germany and Britain in the summer of 1940?\",\"zh\":\"1940年夏天在德國和英國之間展開的「不列顛戰役」是一場怎樣的戰鬥？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"A battle in the sea\",\"zh\":\"海戰\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"An aerial battle\",\"zh\":\"空戰\"},\"isCorrect\":true},{\"id\":\"C\",\"text\":{\"en\":\"A battle in the mountains\",\"zh\":\"山地戰\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"A battle without riffles\",\"zh\":\"不用步槍的戰鬥\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"The Battle of Britain was a crucial aerial battle fought in the summer of 1940 between the British Royal Air Force and the German Luftwaffe.\",\"zh\":\"不列顛戰役是1940年夏天在英國皇家空軍與德國空軍之間展開的一場關鍵空戰。\"}},{\"id\":\"14-7\",\"question\":{\"en\":\"A judiciary is responsible for which TWO of the following :\",\"zh\":\"司法機構負責以下哪兩項職責：\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Arresting people\",\"zh\":\"逮捕人\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Making sure that trials are fair\",\"zh\":\"確保審判公正\"},\"isCorrect\":true},{\"id\":\"C\",\"text\":{\"en\":\"Interpreting the law\",\"zh\":\"解釋法律\"},\"isCorrect\":true},{\"id\":\"D\",\"text\":{\"en\":\"Making the law\",\"zh\":\"制定法律\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"The judiciary is responsible for interpreting the law and ensuring fair trials. Lawmaking is done by Parliament, and arrests are made by the police.\",\"zh\":\"司法機構負責解釋法律並確保審判公正。法律由議會制定，逮捕人則由警察執行。\"}},{\"id\":\"14-8\",\"question\":{\"en\":\"Is the statement below TRUE or FALSE? The Channel Islands and the Isle of Man are part of the UK.\",\"zh\":\"以下說法是正確還是錯誤？海峽群島和曼島是英國的一部分。\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"True\",\"zh\":\"正確\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"False\",\"zh\":\"錯誤\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"The Channel Islands and the Isle of Man are Crown dependencies but are not part of the United Kingdom.\",\"zh\":\"海峽群島 and 曼島是皇家屬地，但並非聯合王國（英國）的一部分。\"}},{\"id\":\"14-9\",\"question\":{\"en\":\"What is the small claims procedure?\",\"zh\":\"什麼是小額索賠程序？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"An informal way of helping people to settle minor disputes without spending a lot of time and money using a lawyer\",\"zh\":\"一種非正式的方式，幫助人們在不花費大量時間和金錢聘請律師的情況下解決小糾紛\"},\"isCorrect\":true},{\"id\":\"B\",\"text\":{\"en\":\"A procedure that helps people to make small home insurance claims in certain circumstances\",\"zh\":\"一種幫助人們在特定情況下進行小額家庭保險索賠的程序\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"The small claims procedure is an informal, low-cost way to resolve minor legal disputes without needing a lawyer.\",\"zh\":\"小額索賠程序是一種非正式、低成本的方式，無需律師即可解決輕微的法律糾紛。\"}},{\"id\":\"14-10\",\"question\":{\"en\":\"Who developed the radar?\",\"zh\":\"誰研發了雷達？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"John Logie Baird\",\"zh\":\"約翰 · 洛吉 · 貝爾德\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Sir Frank Whittle\",\"zh\":\"法蘭克 · 惠特爾爵士\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Sir Christopher Cockrell\",\"zh\":\"克里斯多福 · 考克雷爾爵士\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Sir Robert Watson-Watt\",\"zh\":\"羅伯特 · 沃森-瓦特爵士\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"Sir Robert Watson-Watt developed the radar system, which played a crucial role in the Battle of Britain.\",\"zh\":\"羅伯特 · 沃森-瓦特爵士 （Sir Robert Watson-Watt） 研發了雷達系統，這在不列顛戰役中發揮了關鍵作用。\"}},{\"id\":\"14-11\",\"question\":{\"en\":\"What were The Canterbury Tales?\",\"zh\":\"《坎特伯雷故事集》（The Canterbury Tales）是什麼？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"A series of poems\",\"zh\":\"一系列的詩歌\"},\"isCorrect\":true},{\"id\":\"B\",\"text\":{\"en\":\"A story about Canterbury Cathedral\",\"zh\":\"關於坎特伯雷大教堂的故事\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"A book of Christian doctrine\",\"zh\":\"一本基督教教義書\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"A Royal Charter\",\"zh\":\"一份皇家特許狀\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"The Canterbury Tales is a collection of 24 stories written in Middle English by Geoffrey Chaucer, mostly written in verse (poems).\",\"zh\":\"《坎特伯雷故事集》（The Canterbury Tales）是傑弗里·喬叟用中古英語撰寫的24個故事的合集，大部分以詩歌形式寫成。\"}},{\"id\":\"14-12\",\"question\":{\"en\":\"Haggis is a traditional food from which area?\",\"zh\":\"哈吉斯（Haggis）是哪個地區的傳統食物？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Wales\",\"zh\":\"威爾斯\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"England\",\"zh\":\"英格蘭\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Northern Ireland\",\"zh\":\"北愛爾蘭\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Scotland\",\"zh\":\"蘇格蘭\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"Haggis is a traditional Scottish dish made from sheep's offal, oatmeal, suet, onion, and spices.\",\"zh\":\"哈吉斯是蘇格蘭的傳統菜餚，由羊內臟、燕麥片、板油、洋蔥和香料製成。\"}},{\"id\":\"14-13\",\"question\":{\"en\":\"What is the common name for the Yeoman Warders at the Tower of London?\",\"zh\":\"倫敦塔的御林兵（Yeoman Warders）的俗稱是什麼？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Beefeaters\",\"zh\":\"牛肉饕客\"},\"isCorrect\":true},{\"id\":\"B\",\"text\":{\"en\":\"Pikestaff\",\"zh\":\"槍柄軍\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Queen's Men\",\"zh\":\"女王隨從\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Crown Guards\",\"zh\":\"王室衛兵\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"The Yeoman Warders, popularly known as Beefeaters, have guarded the Tower of London since Tudor times.\",\"zh\":\"御林兵（Yeoman Warders），俗稱「牛肉饕客」（Beefeaters），自都鐸王朝以來就一直看守著倫敦塔。\"}},{\"id\":\"14-14\",\"question\":{\"en\":\"In 1348, one third of the population in England, Wales and Scotland died as a result of which disease?\",\"zh\":\"1348年，英格蘭、威爾斯和蘇格蘭有三分之一的人口因哪種疾病而死亡？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Measles\",\"zh\":\"麻疹\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Leprocy\",\"zh\":\"麻風病\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Smallpox\",\"zh\":\"天花\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"The Black Death\",\"zh\":\"黑死病\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"The Black Death was a bubonic plague pandemic that struck Britain in 1348 and killed about a third of the population.\",\"zh\":\"黑死病是1348年席捲英國的腺鼠疫大流行，導致約三分之一的人口死亡。\"}},{\"id\":\"14-15\",\"question\":{\"en\":\"Racial crime and smoking in public places are examples of:\",\"zh\":\"種族犯罪和在公共場所吸菸是以下哪項的例子：\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Civil offences\",\"zh\":\"民事違法行為\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Criminal offences\",\"zh\":\"刑事犯罪行為\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"Both racial crime and smoking in designated smoke-free public places are criminal offences in the UK.\",\"zh\":\"在英國，種族犯罪和在規定的無菸公共場所吸菸都屬於刑事犯罪 （Criminal offences） 。\"}},{\"id\":\"14-16\",\"question\":{\"en\":\"During the reign of Charles II parts of London were destroyed, what was the cause of this destruction?\",\"zh\":\"在查理二世統治期間，倫敦的部分地區被摧毀了，造成這場破壞的原因是什麼？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"A war\",\"zh\":\"戰爭\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"A flood\",\"zh\":\"洪水\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"A fire\",\"zh\":\"發生火災\"},\"isCorrect\":true},{\"id\":\"D\",\"text\":{\"en\":\"An earthquake\",\"zh\":\"地震\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"The Great Fire of London in 1666 destroyed large parts of the city during the reign of Charles II.\",\"zh\":\"發生火災。1666年的倫敦大火在查理二世統治期間摧毀了倫敦的大部分地區。\"}},{\"id\":\"14-17\",\"question\":{\"en\":\"What did 'the Butler Act' introduce in 1944?\",\"zh\":\"1944年的「巴特勒法案」(the Butler Act) 引入了什麼？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Free primary education in England, Wales and Scotland\",\"zh\":\"英格蘭、威爾斯和蘇格蘭的免費小學教育\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Free university fees in England, Wales, Scotland and Northern Ireland\",\"zh\":\"英格蘭、威爾斯、蘇格蘭和北愛爾蘭的免費大學學費\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Free primary and secondary education in England, Wales and Scotland\",\"zh\":\"英格蘭、威爾斯和蘇格蘭的免費小學和中學教育\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Free secondary education in England and Wales\",\"zh\":\"英格蘭和威爾斯的免費中學教育\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"The 1944 Education Act, also known as the Butler Act, introduced free secondary education for all in England and Wales.\",\"zh\":\"1944年的《教育法》（也稱為巴特勒法案）在英格蘭和威爾斯為所有人引入了免費的中學教育。\"}},{\"id\":\"14-18\",\"question\":{\"en\":\"Mary died.x Who is the patron saint of Scotland?\",\"zh\":\"瑪麗去世。x 誰是蘇格蘭的守護聖人？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"St Patrick\",\"zh\":\"聖派翠克\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"St David\",\"zh\":\"聖大衛\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"St Andrew\",\"zh\":\"聖安得烈\"},\"isCorrect\":true},{\"id\":\"D\",\"text\":{\"en\":\"St George\",\"zh\":\"聖喬治\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"St Andrew is the patron saint of Scotland. His feast day is celebrated on 30 November.\",\"zh\":\"聖安得烈（St Andrew）是蘇格蘭的守護聖人。他的節日是在11月30日。\"}},{\"id\":\"14-19\",\"question\":{\"en\":\"The version of the Bible created by King James I is known as:\",\"zh\":\"由國王詹姆士一世創立的《聖經》版本被稱為：\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Authorised version\",\"zh\":\"授權版本 (Authorised version)\"},\"isCorrect\":true},{\"id\":\"B\",\"text\":{\"en\":\"Reformed version\",\"zh\":\"改革版本 (Reformed version)\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Approved version\",\"zh\":\"批准版本 (Approved version)\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Unique version\",\"zh\":\"獨特版本 (Unique version)\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"King James I ordered a new translation of the Bible into English, which became known as the Authorised Version (or King James Version).\",\"zh\":\"國王詹姆士一世下令將《聖經》重新翻譯成英文，這部譯本被稱為「授權版」 (Authorised Version，或稱《英王欽定版》)。\"}},{\"id\":\"14-20\",\"question\":{\"en\":\"Is the statement below TRUE or FALSE? Discrimination in the workplace is an example of criminal law.\",\"zh\":\"以下陳述是正確還是錯誤？職場歧視是刑事法律的一個例子。\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"True\",\"zh\":\"正確\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"False\",\"zh\":\"錯誤\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"Discrimination in the workplace is a matter of civil law, which deals with disputes between individuals or groups, rather than criminal law.\",\"zh\":\"職場歧視屬於民事法律範疇，民事法律處理個人或團體之間的糾紛，而非刑事法律。\"}},{\"id\":\"14-21\",\"question\":{\"en\":\"What is the traditional food of Northern Ireland?\",\"zh\":\"北愛爾蘭的傳統美食是什麼？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Haggis\",\"zh\":\"羊肚雜碎麵\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Pancakes\",\"zh\":\"煎餅\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Paella\",\"zh\":\"西班牙大鍋飯\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Ulster Fry\",\"zh\":\"阿爾斯特炸丸子 (Ulster Fry)\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"The Ulster Fry is a traditional food in Northern Ireland.\",\"zh\":\"阿爾斯特炸丸子（Ulster Fry）是北愛爾蘭的傳統美食。\"}},{\"id\":\"14-22\",\"question\":{\"en\":\"Which of the following statements is true?\",\"zh\":\"以下哪項陳述是正確的？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"A Magistrates' Court deals with minor criminal offences\",\"zh\":\"地方法院處理輕微的刑事犯罪\"},\"isCorrect\":true},{\"id\":\"B\",\"text\":{\"en\":\"A Magistrates' Court deals with only the most serious criminal cases.\",\"zh\":\"地方法院僅處理最嚴重的刑事案件。\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"Magistrates' Courts deal with minor criminal offences, and the vast majority of criminal cases in England, Wales, and Northern Ireland are handled there.\",\"zh\":\"地方法院（Magistrates' Court）處理輕微刑事犯罪，英格蘭、威爾斯和北愛爾蘭絕大多數的刑事案件都在地方法院審理。\"}},{\"id\":\"14-23\",\"question\":{\"en\":\"An attempt by which group to put James II's son on the throne instead of George I was quickly defeated?\",\"zh\":\"哪個團體試圖將詹姆士二世的兒子推上王位以取代喬治一世，但很快被擊敗？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"French Huguenots\",\"zh\":\"法國雨格諾派\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"English Puritans\",\"zh\":\"英國清教徒\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Irish Catholics\",\"zh\":\"愛爾蘭天主教徒\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Scottish Jacobites\",\"zh\":\"蘇格蘭詹姆士黨人\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"In 1715, Scottish Jacobites attempted to put James II's son on the throne, but the rebellion was quickly defeated.\",\"zh\":\"1715年，蘇格蘭詹姆士黨人（Jacobites）試圖將詹姆士二世的兒子推上王位，但叛亂很快被擊敗。\"}},{\"id\":\"14-24\",\"question\":{\"en\":\"Why is 1928 an important year in women's voting history?\",\"zh\":\"為什麼1928年在女性投票歷史上是重要的一年？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Women were given the right to vote at the age of 18, the same as men.\",\"zh\":\"女性在18歲獲得投票權，與男性相同。\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Women were given the right to vote at the age of 25.\",\"zh\":\"女性在25歲獲得投票權。\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Women were given the right to vote at the age of 30.\",\"zh\":\"女性在30歲獲得投票權。\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Women were given the right to vote at the age of 21, the same as men.\",\"zh\":\"女性在21歲獲得投票權，與男性相同。\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"In 1928, the voting age for women was lowered to 21, giving them the same voting rights as men.\",\"zh\":\"1928年，女性的投票年齡降至21歲，使她們獲得了與男性相同的投票權。\"}}]}}]}]\n"])</script><script>self.__next_f.push([1,"d:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#111827\"}]]\n"])</script><script>self.__next_f.push([1,"13:I[27201,[\"/LifeInUKAIO/_next/static/chunks/2n6eah28il8u-.js\",\"/LifeInUKAIO/_next/static/chunks/14mrh2-p_w84d.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"f:[[\"$\",\"title\",\"0\",{\"children\":\"Life in UK AIO - Bilingual Mock Test \u0026 Study Guide\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Bilingual (EN/ZH) Mock Tests and Complete Study Guide for Life in the UK Citizenship Exam\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/
