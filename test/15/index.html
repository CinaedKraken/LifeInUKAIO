dence.\",\"zh\":\"羅伯特·布魯斯在 1314 年的班諾克本戰役中擊敗了由愛德華二世率領的英格蘭軍隊，確保了蘇格蘭的獨立。\"}},{\"id\":\"15-3\",\"question\":{\"en\":\"How often are European parliamentary elections held?\",\"zh\":\"歐洲議會選舉每隔幾年舉行一次？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Every three years\",\"zh\":\"每三年\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Every four years\",\"zh\":\"每四年\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Every five years\",\"zh\":\"每五年\"},\"isCorrect\":true},{\"id\":\"D\",\"text\":{\"en\":\"Every six years\",\"zh\":\"每六年\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"Elections to the European Parliament were held every five years (until the UK left the European Union).\",\"zh\":\"歐洲議會選舉每 5 年舉行一次 (直至英國脫離歐盟)。\"}},{\"id\":\"15-4\",\"question\":{\"en\":\"What was Isaac Newton known for?\",\"zh\":\"艾薩克·牛頓（Isaac Newton）以什麼聞名？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"The discovery of insulin\",\"zh\":\"發現胰島素\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"The discovery of gravity\",\"zh\":\"發現重力\"},\"isCorrect\":true},{\"id\":\"C\",\"text\":{\"en\":\"The discovery of penicillin\",\"zh\":\"發現青黴素（盤尼西林）\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"The discovery of the steam power\",\"zh\":\"發現蒸汽動力\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"Sir Isaac Newton was a famous English physicist and mathematician who discovered the laws of gravity and motion.\",\"zh\":\"艾薩克·牛頓爵士（Sir Isaac Newton）是著名的英國物理學家和數學家，他發現了重力和運動定律。\"}},{\"id\":\"15-5\",\"question\":{\"en\":\"What is the title of the Queen's eldest son, Prince Charles?\",\"zh\":\"女王長子查爾斯王子的頭銜是什麼？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Prince of Kent\",\"zh\":\"肯特親王\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Prince of Wales\",\"zh\":\"威爾斯親王\"},\"isCorrect\":true},{\"id\":\"C\",\"text\":{\"en\":\"Prince of Hanover\",\"zh\":\"漢諾威親王\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Prince of Brunswick\",\"zh\":\"不倫瑞克親王\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"As the eldest son of Queen Elizabeth II and heir apparent, Prince Charles was given the traditional title of the Prince of Wales.\",\"zh\":\"作為伊麗莎白二世女王的長子和法定繼承人，查爾斯王子被授予傳統的威爾斯親王（Prince of Wales）頭銜。\"}},{\"id\":\"15-6\",\"question\":{\"en\":\"they could seize lands belonging to the nobility as they wished. Which country is not represented on the Union Flag?\",\"zh\":\"他們可以隨心所欲地奪取屬於貴族的土地。哪個國家沒有在聯邦國旗（米字旗）上體現？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Northern Ireland\",\"zh\":\"北愛爾蘭\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Scotland\",\"zh\":\"蘇格蘭\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Wales\",\"zh\":\"威爾斯\"},\"isCorrect\":true},{\"id\":\"D\",\"text\":{\"en\":\"England\",\"zh\":\"英格蘭\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"Wales is not represented on the Union Flag (Union Jack) because Wales was already united with England when the first flag was created in 1606.\",\"zh\":\"威爾斯沒有在聯邦國旗上體現，因為在1606年設計第一面國旗時，威爾斯已經與英格蘭合併。\"}},{\"id\":\"15-7\",\"question\":{\"en\":\"When does Easter take place?\",\"zh\":\"復活節在什麼時候舉行？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"November or December\",\"zh\":\"11 月或 12 月\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"January or February\",\"zh\":\"1 月或 2 月\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"March or April\",\"zh\":\"3 月或 4 月\"},\"isCorrect\":true},{\"id\":\"D\",\"text\":{\"en\":\"May or June\",\"zh\":\"5 月或 6 月\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"Easter is a Christian holiday that takes place in March or April.\",\"zh\":\"復活節是基督教節日，在每年的 3 月或 4 月舉行。\"}},{\"id\":\"15-8\",\"question\":{\"en\":\"How old do citizens of the UK, the Irish Republic or the Commonwealth have to be to stand for public office?\",\"zh\":\"英國、愛爾蘭共和國或大英國協的公民需要達到多少歲才能競選公職？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"18\",\"zh\":\"18歲\"},\"isCorrect\":true},{\"id\":\"B\",\"text\":{\"en\":\"21\",\"zh\":\"21歲\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"16\",\"zh\":\"16歲\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"25\",\"zh\":\"25歲\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"You must be at least 18 years old to stand for public office, such as an MP or local councillor, in the UK.\",\"zh\":\"在英國，您必須年滿18歲才能競選公職（例如國會議員或地方議員）。\"}},{\"id\":\"15-9\",\"question\":{\"en\":\"When was the Carta Magna created?\",\"zh\":\"大憲章（Magna Carta）是在何時創建的？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"1514\",\"zh\":\"1514年\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"1215\",\"zh\":\"1215年\"},\"isCorrect\":true},{\"id\":\"C\",\"text\":{\"en\":\"1415\",\"zh\":\"1415年\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"1314\",\"zh\":\"1314年\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"The Magna Carta (Great Charter) was created in 1215 when King John was forced by his barons to sign it, establishing that the king was subject to the law.\",\"zh\":\"大憲章（Magna Carta）建於1215年，當時約翰國王被迫與貴族簽署，確立了法律高於王權的原則。\"}},{\"id\":\"15-10\",\"question\":{\"en\":\"William Shakespeare wrote a number of sonnets. What are sonnets?\",\"zh\":\"威廉·莎士比亞創作了許多十四行詩。什麼是十四行詩？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Poems of 14 lines\",\"zh\":\"14行的詩歌\"},\"isCorrect\":true},{\"id\":\"B\",\"text\":{\"en\":\"Rhyming poems\",\"zh\":\"押韻詩\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Mystery plays\",\"zh\":\"神秘劇\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Stories for children\",\"zh\":\"兒童故事\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"Sonnets are 14-line poems with a specific structure. Shakespeare wrote 154 of them.\",\"zh\":\"十四行詩（sonnet）是具有特定結構的14行詩。莎士比亞創作了154首此類詩歌。\"}},{\"id\":\"15-11\",\"question\":{\"en\":\"Who is the spiritual leader of the Church of England?\",\"zh\":\"誰是英格蘭教會 (聖公會) 的精神領袖？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"The Archbishop of Canterbury\",\"zh\":\"坎特伯雷大主教 (The Archbishop of Canterbury)\"},\"isCorrect\":true},{\"id\":\"B\",\"text\":{\"en\":\"The Archbishop of London\",\"zh\":\"倫敦大主教 (The Archbishop of London)\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"The Archbishop of Birmingham\",\"zh\":\"伯明罕大主教 (The Archbishop of Birmingham)\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"The Archbishop of Manchester\",\"zh\":\"曼徹斯特大主教 (The Archbishop of Manchester)\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"The Archbishop of Canterbury is the spiritual leader of the Church of England (and the global Anglican Communion).\",\"zh\":\"坎特伯雷大主教是英格蘭教會 (以及全球聖公會) 的精神領袖。\"}},{\"id\":\"15-12\",\"question\":{\"en\":\"Who built the Tower of London?\",\"zh\":\"誰建造了倫敦塔？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"William the Conqueror\",\"zh\":\"征服者威廉\"},\"isCorrect\":true},{\"id\":\"B\",\"text\":{\"en\":\"Queen Victoria\",\"zh\":\"維多利亞女王\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Queen Elizabeth I\",\"zh\":\"伊莉莎白一世女王\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Oliver Cromwell\",\"zh\":\"奧利弗 · 克倫威爾\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"The Tower of London was built by William the Conqueror after his invasion of England in 1066.\",\"zh\":\"倫敦塔是由征服者威廉 （William the Conqueror） 在 1066 年入侵英格蘭後建造的。\"}},{\"id\":\"15-13\",\"question\":{\"en\":\"St Patrick's day is a public holiday in Northern Ireland.\",\"zh\":\"聖派翠克節（St Patrick's day）在北愛爾蘭是公眾假期。\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"True\",\"zh\":\"正確\"},\"isCorrect\":true},{\"id\":\"B\",\"text\":{\"en\":\"False\",\"zh\":\"錯誤\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"St Patrick's Day is the patron saint day of Ireland and is a public holiday in Northern Ireland, celebrated on 17 March.\",\"zh\":\"聖派翠克節是北愛爾蘭的公眾假期，於3月17日慶祝。\"}},{\"id\":\"15-14\",\"question\":{\"en\":\"How is the electoral register updated?\",\"zh\":\"選民登記冊是如何更新的？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Eligible voters must phone their local councillor\",\"zh\":\"符合條件的選民必須致電當地的區議員\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Every household must request a registration form\",\"zh\":\"每個住戶必須主動申請登記表\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Every household receives a phone call to enquire about eligible voter\",\"zh\":\"每個住戶都會接到電話，詢問有關符合條件的選民資訊\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Every household receives a registration form, which must be completed and returned.\",\"zh\":\"每個住戶都會收到一份登記表，必須填妥並寄回。\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"The electoral register is updated by an annual canvass. Every household receives a form (the annual canvass form) to update the register, which must be completed and returned.\",\"zh\":\"選民登記冊是透過年度調查進行更新的。每個住戶都會收到一份登記表，必須填妥並寄回。\"}},{\"id\":\"15-15\",\"question\":{\"en\":\"During the reign of Elizabeth I, a large fleet of ships was sent to England to conquer the country and to restore Catholicism, where did this fleet come from?\",\"zh\":\"在伊麗莎白一世統治期間，一支大型船隊被派往英格蘭以征服該國並恢復天主教，這支船隊來自哪裡？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"France\",\"zh\":\"法國（France）\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Portugal\",\"zh\":\"葡萄牙（Portugal）\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Spain\",\"zh\":\"西班牙（Spain）\"},\"isCorrect\":true},{\"id\":\"D\",\"text\":{\"en\":\"Italy\",\"zh\":\"義大利（Italy）\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"In 1588, Spain sent a large fleet of ships, known as the Spanish Armada, to conquer England and restore Catholicism, but it was defeated.\",\"zh\":\"在 1588 年，西班牙派遣了一支被稱為「西班牙無敵艦隊」的大型船隊企圖征服英格蘭並恢復天主教，但最終被擊敗。\"}},{\"id\":\"15-16\",\"question\":{\"en\":\"What charity works to preserve important buildings, coastline and countryside in the UK?\",\"zh\":\"英國哪個慈善機構致力於保護重要的建築、海岸線和鄉村？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Shelter\",\"zh\":\"Shelter (庇護所)\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Age UK\",\"zh\":\"Age UK (英國老年協會)\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Crisis\",\"zh\":\"Crisis (危機)\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"The National Trust\",\"zh\":\"The National Trust (國家信託)\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"The National Trust is a UK charity that preserves historic buildings, coastlines, and the countryside.\",\"zh\":\"The National Trust (國家信託)。該機構專門保護歷史建築、海岸線和自然景觀。\"}},{\"id\":\"15-17\",\"question\":{\"en\":\"What medal did Mary Peters win in the 1972 Olympics?\",\"zh\":\"瑪麗·彼得斯在1972年奧運會上贏得了什麼獎牌？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"She did not win any medals\",\"zh\":\"她沒有贏得任何獎牌\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Silver\",\"zh\":\"銀牌\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Gold\",\"zh\":\"金牌\"},\"isCorrect\":true},{\"id\":\"D\",\"text\":{\"en\":\"Bronze\",\"zh\":\"銅牌\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"Mary Peters won a gold medal in the pentathlon at the 1972 Olympics.\",\"zh\":\"瑪麗·彼得斯（Mary Peters）在1972年奧運會上贏得了五項全能的金牌。\"}},{\"id\":\"15-18\",\"question\":{\"en\":\"What is the minimum age required to serve on a jury?\",\"zh\":\"擔任陪審員的最低年齡要求是多少？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"16\",\"zh\":\"16歲\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"18\",\"zh\":\"18歲\"},\"isCorrect\":true},{\"id\":\"C\",\"text\":{\"en\":\"21\",\"zh\":\"21歲\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"25\",\"zh\":\"25歲\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"To serve on a jury, you must be aged between 18 and 75 (in England, Wales, and Northern Ireland) and registered to vote.\",\"zh\":\"要擔任陪審員，您必須年滿18至75歲（在英格蘭、威爾斯和北愛爾蘭），且已註冊為選民。\"}},{\"id\":\"15-19\",\"question\":{\"en\":\"Which of the following poems is about a group of people going on a pilgrimage?\",\"zh\":\"以下哪首詩/文學作品是關於一群去朝聖的人？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"The Canterbury Tales\",\"zh\":\"坎特伯里故事集 (The Canterbury Tales)\"},\"isCorrect\":true},{\"id\":\"B\",\"text\":{\"en\":\"All the world's a stage\",\"zh\":\"全世界是一個舞台 (All the world's a stage)\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"A Midsummer Night's dream\",\"zh\":\"仲夏夜之夢 (A Midsummer Night's dream)\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Great Expectations\",\"zh\":\"遠大前程 (Great Expectations)\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"'The Canterbury Tales' by Geoffrey Chaucer is a collection of stories told by a group of pilgrims on their way to Canterbury.\",\"zh\":\"傑弗里·喬叟所著的《坎特伯里故事集》 (The Canterbury Tales) 是一部講述一群朝聖者在前往坎特伯里途中講述故事的集合。\"}},{\"id\":\"15-20\",\"question\":{\"en\":\"By law, radio and television coverage of the political parties must be balanced and so equal time has to be given to rival viewpoints.\",\"zh\":\"依法，廣播和電視對政黨的報導必須保持平衡，因此必須給予不同觀點平等的發言時間。\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"True\",\"zh\":\"正確\"},\"isCorrect\":true},{\"id\":\"B\",\"text\":{\"en\":\"False\",\"zh\":\"錯誤\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"Unlike newspapers, British radio and television broadcasters are legally required to provide balanced and impartial coverage of political parties.\",\"zh\":\"與報紙不同，英國法律規定廣播和電視媒體對政黨的報導必須保持平衡與公正，並向相互競爭的觀點提供平等的發言時間。\"}},{\"id\":\"15-21\",\"question\":{\"en\":\"Which armed force was used in the Battle of Britain?\",\"zh\":\"不列顛戰役 (Battle of Britain) 中動用了哪支武裝力量？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"The Royal Navy\",\"zh\":\"皇家海軍 (The Royal Navy)\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"The Police Force\",\"zh\":\"警察部隊 (The Police Force)\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"The Naval Service\",\"zh\":\"海軍服役機構 (The Naval Service)\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"The Royal Air Force\",\"zh\":\"皇家空軍 (The Royal Air Force)\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"The Battle of Britain (1940) was fought entirely in the air between the British Royal Air Force (RAF) and the German Luftwaffe.\",\"zh\":\"不列顛戰役 (1940 年) 是一場完全在空中進行的對決，由英國皇家空軍 (RAF) 對抗德國空軍。\"}},{\"id\":\"15-22\",\"question\":{\"en\":\"Who
