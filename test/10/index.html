",\"zh\":\"法夫（Fife）\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Edinburgh\",\"zh\":\"愛丁堡（Edinburgh）\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Ayr\",\"zh\":\"艾爾（Ayr）\"},\"isCorrect\":true},{\"id\":\"D\",\"text\":{\"en\":\"St Andrews\",\"zh\":\"聖安德魯斯（St Andrews）\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"The Scottish Grand National is a prestigious National Hunt horse race held at Ayr Racecourse.\",\"zh\":\"蘇格蘭國家障礙大賽（Scottish Grand National）是一項享譽盛名的國家狩獵障礙馬賽，在艾爾馬場（Ayr Racecourse）舉行。\"}},{\"id\":\"10-4\",\"question\":{\"en\":\"What other name is given to Diwali?\",\"zh\":\"排燈節（Diwali）還有什麼其他名稱？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"The Festival of Lights\",\"zh\":\"光明節（The Festival of Lights）\"},\"isCorrect\":true},{\"id\":\"B\",\"text\":{\"en\":\"Ash Wednesday\",\"zh\":\"大齋首日/灰週三（Ash Wednesday）\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Good Friday\",\"zh\":\"耶穌受難日（Good Friday）\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Easter Monday\",\"zh\":\"復活節星期一（Easter Monday）\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"Diwali is a Hindu and Sikh festival widely known as the 'Festival of Lights'.\",\"zh\":\"排燈節（Diwali）是印度教和錫克教的節日，廣為人知的別名為「光明節」（Festival of Lights）。\"}},{\"id\":\"10-5\",\"question\":{\"en\":\"Who invented the World Wide Web?\",\"zh\":\"誰發明了全球資訊網 (World Wide Web)？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Sir Tim Berners-Lee\",\"zh\":\"提姆·柏內茲-李爵士 (Sir Tim Berners-Lee)\"},\"isCorrect\":true},{\"id\":\"B\",\"text\":{\"en\":\"Sir Peter Mansfield\",\"zh\":\"彼得·曼斯菲爾德爵士 (Sir Peter Mansfield)\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Sir Ian Wilmot\",\"zh\":\"伊恩·威爾穆特爵士 (Sir Ian Wilmut)\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Sir Robert Edwards\",\"zh\":\"羅伯特·愛德華茲爵士 (Sir Robert Edwards)\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"Sir Tim Berners-Lee invented the World Wide Web (WWW) in 1989, which revolutionized information sharing globally.\",\"zh\":\"提姆·柏內茲-李爵士於 1989 年發明了全球資訊網 (WWW)，這徹底改變了全球的信息共享方式。\"}},{\"id\":\"10-6\",\"question\":{\"en\":\"If you think someone is trying to persuade you to join an extremist or terrorist activity, who should you contact?\",\"zh\":\"如果你認為有人試圖說服你加入極端主義或恐怖主義活動，你應該聯繫誰？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"The Home Office\",\"zh\":\"內政部\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Your local police force\",\"zh\":\"當地警察局\"},\"isCorrect\":true},{\"id\":\"C\",\"text\":{\"en\":\"Your local MP\",\"zh\":\"當地國會議員 (MP)\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Your family\",\"zh\":\"你的家人\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"You should contact your local police force if you suspect someone is trying to involve you in extremist or terrorist activities.\",\"zh\":\"如果你懷疑有人試圖拉攏你參與極端或恐怖活動，應立即聯絡當地警方。\"}},{\"id\":\"10-7\",\"question\":{\"en\":\"Northern Ireland and Scotland have their own banknotes, which are valid everywhere in the UK.\",\"zh\":\"北愛爾蘭和蘇格蘭擁有自己的紙幣，這些紙幣在整個英國都是有效的。\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"True\",\"zh\":\"正確\"},\"isCorrect\":true},{\"id\":\"B\",\"text\":{\"en\":\"False\",\"zh\":\"錯誤\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"Banknotes printed in Scotland and Northern Ireland are valid currency throughout the UK, though businesses are not legally required to accept them.\",\"zh\":\"蘇格蘭和北愛爾蘭印製的紙幣在整個英國都是有效貨幣，儘管法律並未強制要求商家必須接受它們。\"}},{\"id\":\"10-8\",\"question\":{\"en\":\"Can court orders be obtained to protect a person from being forced into a marriage?\",\"zh\":\"可以取得法院命令來保護某人不被強迫結婚嗎？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Yes\",\"zh\":\"可以\"},\"isCorrect\":true},{\"id\":\"B\",\"text\":{\"en\":\"No\",\"zh\":\"不可以\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"Forced marriage is illegal in the UK, and court orders can be obtained to protect a person from it.\",\"zh\":\"強迫婚姻在英國是違法的，可以申請法院命令來保護免受強迫婚姻。\"}},{\"id\":\"10-9\",\"question\":{\"en\":\"How often are the members of the Welsh Assembly (AMs) elected?\",\"zh\":\"威爾斯議會議員 (AMs) 多久選舉一次？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Every 5 years\",\"zh\":\"每5年\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Every 2 years\",\"zh\":\"每2年\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Every 4 years\",\"zh\":\"每4年\"},\"isCorrect\":true},{\"id\":\"D\",\"text\":{\"en\":\"Every 3 years\",\"zh\":\"每3年\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"Members of the Welsh Assembly (now called Senedd) are typically elected every four years.\",\"zh\":\"威爾斯議會議員（現稱為 Senedd）通常每四年選舉一次。\"}},{\"id\":\"10-10\",\"question\":{\"en\":\"MPs have a duty to serve and represent which of the following groups?\",\"zh\":\"國會議員（MPs）有義務服務並代表以下哪一個群體？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Everyone in their constituency who voted for them\",\"zh\":\"選區內所有投票給他們的人\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"The House of Lords\",\"zh\":\"上議院\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Their fellow MPs\",\"zh\":\"其他國會議員\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Everyone in their constituency\",\"zh\":\"選區內的所有人\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"Members of Parliament (MPs) represent all the people in their local area (constituency), regardless of whether they voted for them or not.\",\"zh\":\"國會議員（MPs）代表其所在選區（constituency）的所有人，無論這些人是否投票給他們。\"}},{\"id\":\"10-11\",\"question\":{\"en\":\"What led the American colonies to want their independence from Britain?\",\"zh\":\"是什麼原因促使北美殖民地要求脫離英國獨立？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"The British government wanted to control their borders\",\"zh\":\"英國政府想控制他們的邊界\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"They were running out of resources\",\"zh\":\"資源即將耗盡\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"The British government wanted to tax them\",\"zh\":\"英國政府想對他們徵稅\"},\"isCorrect\":true},{\"id\":\"D\",\"text\":{\"en\":\"There were not enough jobs for the local people\",\"zh\":\"當地人沒有足夠的工作機會\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"The American colonies demanded independence largely because the British government sought to impose taxes on them without allowing them representation in Parliament.\",\"zh\":\"由於英國政府在沒有給予他們議會代表權的情況下對其徵稅，引發了美國獨立戰爭。\"}},{\"id\":\"10-12\",\"question\":{\"en\":\"Under which king did the Anglo-Saxon kingdoms in England unite to defeat the Vikings?\",\"zh\":\"在位哪位國王統治下，英格蘭的撒克遜王國聯合起來擊敗了維京人？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"William of Orange\",\"zh\":\"奧蘭治的威廉\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"King Alfred the Great\",\"zh\":\"阿佛烈大帝\"},\"isCorrect\":true},{\"id\":\"C\",\"text\":{\"en\":\"Henry VIII\",\"zh\":\"亨利八世\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Robert the Bruce\",\"zh\":\"羅伯特·布魯斯\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"King Alfred the Great defeated the Vikings and united the Anglo-Saxon kingdoms in England under his leadership.\",\"zh\":\"阿佛烈大帝（King Alfred the Great）擊敗了維京人，並在其領導下統一了英格蘭的盎格魯-撒克遜王國。\"}},{\"id\":\"10-13\",\"question\":{\"en\":\"Where does the UK Parliament sit?\",\"zh\":\"英國國會設在哪裡？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"The House of Lords\",\"zh\":\"上議院\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Downing Street\",\"zh\":\"唐寧街\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Westminster\",\"zh\":\"西敏\"},\"isCorrect\":true},{\"id\":\"D\",\"text\":{\"en\":\"Stormont\",\"zh\":\"斯托蒙特\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"The Parliament of the United Kingdom sits at the Palace of Westminster in London.\",\"zh\":\"英國國會坐落於倫敦的西敏宮（Palace of Westminster）。\"}},{\"id\":\"10-14\",\"question\":{\"en\":\"Which two countries developed the Concorde, the world's only supersonic commercial airliner?\",\"zh\":\"哪兩個國家共同開發了世界上唯一的超音速商用客機「協和號」？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Italy\",\"zh\":\"義大利\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"Britain\",\"zh\":\"英國\"},\"isCorrect\":true},{\"id\":\"C\",\"text\":{\"en\":\"Germany\",\"zh\":\"德國\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"France\",\"zh\":\"法國\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"Concorde was developed jointly by Britain and France and remains the world's only supersonic commercial airliner to have been in regular service.\",\"zh\":\"協和號是由英國和法國合作研發的。\"}},{\"id\":\"10-15\",\"question\":{\"en\":\"The First World War ended in victory for Britain and its allies. At what exact time and date in 1918 did the war end officially?\",\"zh\":\"第一次世界大戰以英國及其盟國的勝利告終。這場戰爭在1918年的哪個確切時間和日期正式結束？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"6am on 6 June\",\"zh\":\"6月6日上午6點\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"8am on 8 August\",\"zh\":\"8月8日上午8點\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"10am on 10 October\",\"zh\":\"10月10日上午10點\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"11am on 11 November\",\"zh\":\"11月11日上午11點\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"The armistice that ended the fighting in the First World War went into effect at 11 am on 11 November 1918.\",\"zh\":\"結束第一次世界大戰戰鬥的停戰協定於1918年11月11日上午11點正式生效。\"}},{\"id\":\"10-16\",\"question\":{\"en\":\"When is Hogmanay celebrated?\",\"zh\":\"蘇格蘭除夕 (Hogmanay) 是在什麼時候慶祝？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"25th of December\",\"zh\":\"12 月 25 日\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"2nd of January\",\"zh\":\"1 月 2 日\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"1st of January\",\"zh\":\"1 月 1 日\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"31st of December\",\"zh\":\"12 月 31 日\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"Hogmanay is the Scottish word for New Year's Eve and is celebrated on 31st December.\",\"zh\":\"「Hogmanay」是蘇格蘭語中的除夕 (New Year's Eve)，於 12 月 31 日進行慶祝。\"}},{\"id\":\"10-17\",\"question\":{\"en\":\"It is compulsory for 16 and 17-year-olds to join the National Citizen Service programme.\",\"zh\":\"16和17歲的青少年必須強制參加國家公民服務 (NCS) 計畫。\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"True\",\"zh\":\"正確\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"False\",\"zh\":\"錯誤\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"The National Citizen Service (NCS) is an optional programme for 16 and 17-year-olds; it is not compulsory.\",\"zh\":\"國家公民服務計畫是自願參加的，並非強制。\"}},{\"id\":\"10-18\",\"question\":{\"en\":\"When did the UK join the EU?\",\"zh\":\"英國於何時加入歐盟（EU）？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"In 1957\",\"zh\":\"在 1957 年\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"In 1973\",\"zh\":\"在 1973 年\"},\"isCorrect\":true},{\"id\":\"C\",\"text\":{\"en\":\"In 1975\",\"zh\":\"在 1975 年\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"In 1964\",\"zh\":\"在 1964 年\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"The UK joined the European Economic Community (EEC), which later became the European Union (EU), in 1973.\",\"zh\":\"英國於 1973 年加入歐洲經濟共同體（EEC，後來的歐盟 EU）。\"}},{\"id\":\"10-19\",\"question\":{\"en\":\"Which of the following tells us about how people lived in England just after the Norman Conquest?\",\"zh\":\"下列哪一項告訴我們諾曼征服後英格蘭人民的生活狀況？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"The Domesday Book\",\"zh\":\"末日審判書 (The Domesday Book)\"},\"isCorrect\":true},{\"id\":\"B\",\"text\":{\"en\":\"The Book of Common Prayer\",\"zh\":\"公禱書\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"The Canterbury Tales\",\"zh\":\"坎特伯雷故事集\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"The Carta Magna\",\"zh\":\"大憲章\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"The Domesday Book detailed the land and population of England after the Norman Conquest.\",\"zh\":\"《末日審判書》（The Domesday Book）詳細記載了諾曼征服後英格蘭土地和人口的狀況。\"}},{\"id\":\"10-20\",\"question\":{\"en\":\"What movement challenged the authority of the Pope?\",\"zh\":\"哪場運動挑戰了教宗的權威？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"The Swinging Sixties\",\"zh\":\"搖擺的六十年代\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"The Reformation\",\"zh\":\"宗教改革 (The Reformation)\"},\"isCorrect\":true},{\"id\":\"C\",\"text\":{\"en\":\"The Suffragettes\",\"zh\":\"婦女參政運動\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"The Enlightenment\",\"zh\":\"啟蒙運動\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"The Reformation was a movement in the 16th century that challenged the Pope's authority and led to the creation of Protestant churches.\",\"zh\":\"宗教改革是16世紀的一場運動，挑戰了教宗的權威，並導致了新教教會的建立。\"}},{\"id\":\"10-21\",\"question\":{\"en\":\"Can the National Anthem be played if the Queen is not present?\",\"zh\":\"如果女王不在場，可以演奏國歌嗎？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Yes\",\"zh\":\"可以\"},\"isCorrect\":true},{\"id\":\"B\",\"text\":{\"en\":\"No\",\"zh\":\"不可以\"},\"isCorrect\":false}],\"explanation\":{\"en\":\"The National Anthem can be played on many public and official occasions, such as sports events, and does not require the presence of the Monarch.\",\"zh\":\"國歌可以在許多公共和官方場合演奏（例如體育賽事），並不需要君主在場。\"}},{\"id\":\"10-22\",\"question\":{\"en\":\"Which three territories form Great Britain?\",\"zh\":\"哪三個地區組成了大不列顛？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Wales\",\"zh\":\"威爾斯\"},\"isCorrect\":true},{\"id\":\"B\",\"text\":{\"en\":\"Northern Ireland\",\"zh\":\"北愛爾蘭\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"England\",\"zh\":\"英格蘭\"},\"isCorrect\":true},{\"id\":\"D\",\"text\":{\"en\":\"Scotland\",\"zh\":\"蘇格蘭\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"Great Britain consists of England, Scotland, and Wales. It does not include Northern Ireland.\",\"zh\":\"大不列顛 （Great Britain） 由英格蘭、蘇格蘭和威爾斯組成，不包括北愛爾蘭。\"}},{\"id\":\"10-23\",\"question\":{\"en\":\"Who was in charge of the British fleet at the Battle of Trafalgar?\",\"zh\":\"在特拉法加海戰中，誰負責指揮英國艦隊？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"Oliver Cromwell\",\"zh\":\"奧利弗·克倫威爾（Oliver Cromwell）\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"The Duke of Wellington\",\"zh\":\"威靈頓公爵（The Duke of Wellington）\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"Robert the Bruce\",\"zh\":\"羅伯特·布魯斯（Robert the Bruce）\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"Admiral Nelson\",\"zh\":\"納爾遜海軍上將（Admiral Nelson）\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"Admiral Horatio Nelson was in charge of the British fleet at the Battle of Trafalgar in 1805, where he was killed.\",\"zh\":\"在 1805 年的特拉法加海戰中，霍雷肖·納爾遜海軍上將（Admiral Horatio Nelson）負責指揮英國艦隊，他在這場戰役中不幸犧牲。\"}},{\"id\":\"10-24\",\"question\":{\"en\":\"Which Scottish clan was killed for not taking the oath?\",\"zh\":\"哪個蘇格蘭氏族因未宣誓效忠而被殺害？\"},\"options\":[{\"id\":\"A\",\"text\":{\"en\":\"The MacLaine of Lochbuie\",\"zh\":\"洛赫比的麥克萊恩氏族\"},\"isCorrect\":false},{\"id\":\"B\",\"text\":{\"en\":\"The McDowalls of Garthland\",\"zh\":\"加斯蘭的麥克道爾氏族\"},\"isCorrect\":false},{\"id\":\"C\",\"text\":{\"en\":\"The Macpherson of Cluny\",\"zh\":\"克魯尼的麥克菲森氏族\"},\"isCorrect\":false},{\"id\":\"D\",\"text\":{\"en\":\"The MacDonalds of Glencoe\",\"zh\":\"格倫科的麥克唐納氏族\"},\"isCorrect\":true}],\"explanation\":{\"en\":\"The Massacre of Glencoe took place in 1692, when members of the MacDonald clan were killed for failing to take the oath of allegiance to William III on time.\",\"zh\":\"格倫科大屠殺發生於1692年，當時麥克唐納氏族的成員因未能按時向威廉三世宣誓效忠而遭殺害。\"}}]}}]}]\n"])</script><script>self.__next_f.push([1,"d:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#111827\"}]]\n"])</script><script>self.__next_f.push([1,"13:I[27201,[\"/LifeInUKAIO/_next/static/chunks/322d-2n2l35iv.js\",\"/LifeInUKAIO/_next/static/chunks/14mrh2-p_w84d.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"f:[[\"$\",\"title\",\"0\",{\"children\":\"Life in UK AIO - Bilingual Mock Test \u0026 Study Guide\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Biling
